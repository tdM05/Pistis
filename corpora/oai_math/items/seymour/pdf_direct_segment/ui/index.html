<!DOCTYPE html>
<!--
  PDF-direct segmentation.

  The PDF *is* the source. We render it (PDF.js) and build ONE global character
  sequence from its text layer — every selectable glyph, in reading order,
  concatenated across pages. A box's region is a list of pieces, each a
  [start,end) range of CHARACTER INDICES into that sequence. No LaTeX, no
  SyncTeX, no compile: highlighting is just drawing rectangles over the glyphs
  of the selected character indices (like a PDF highlighter), and the stored
  span is exact because the character sequence is deterministic.

  Left: Boxes tree. Middle/right: the PDF with a selectable text layer + box
  highlights. Select text on the PDF, press n (new box) / e (add to selected) /
  r (remove selection from selected).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seymour — PDF-direct segmentation</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">PDF&#8209;direct seg</div>
  <button id="mkbox" class="btn" disabled>+ box <kbd>n</kbd></button>
  <button id="extendbox" class="btn" disabled>+ add to current <kbd>e</kbd></button>
  <button id="removebox" class="btn" disabled>&minus; remove selection <kbd>r</kbd></button>
  <button id="linkbox" class="btn" disabled>&#10137; link <kbd>l</kbd></button>
  <button id="confirmlink" class="btn confirm" style="display:none" disabled>&#10003; confirm (pick a target)</button>
  <span id="selinfo" class="selinfo"></span>
  <div class="spacer"></div>
  <button id="save" class="btn primary">Save</button>
  <span id="status" class="status"></span>
</header>

<main id="main">
  <aside class="tree-pane" id="pane1">
    <div class="pane-head tabhead">
      <button id="tabBoxes" class="tab active">Boxes</button>
      <button id="tabLean" class="tab">Lean files</button>
    </div>
    <div id="viewBoxes" class="tabview">
      <div class="labelbar">
        <button id="upLevel" class="minibtn" title="go up a level" style="display:none">↑ up</button>
        <span class="spacer"></span>
        <span id="labelPick" class="labelpick"></span>
      </div>
      <div id="tree" class="tree"></div>
    </div>
    <div id="viewLean" class="tabview" style="display:none">
      <div id="leanTree" class="tree leantree"></div>
    </div>
  </aside>
  <div class="splitter" data-left="pane1" data-right="pane2"></div>
  <section class="pdf-pane" id="pane2">
    <div class="pane-head">PDF &middot; <span class="dimlab">select text, then n / e / r · double-click a box to enter it</span>
      <span class="spacer"></span>
      <button id="upLevelPdf" class="minibtn" title="go up a level" style="display:none">↑ up</button>
    </div>
    <div id="pdfScroll" class="pdf-scroll"><div id="pages" class="pages"></div></div>
  </section>
  <div class="splitter" data-left="pane2" data-right="pane3"></div>
  <section class="lean-pane" id="pane3">
    <div class="pane-head lean-head">
      <span id="leanFileLabel" class="leanfilelabel" title="current Lean file">(no file)</span>
      <span class="lean-tools">
        <button id="leanMap" class="minibtn" disabled title="add the Lean selection as a span of the selected box">+ map <kbd>m</kbd></button>
        <button id="leanUnmap" class="minibtn" disabled title="remove the Lean selection from the selected box's spans">&minus; unmap <kbd>r</kbd></button>
        <button id="leanNone" class="minibtn" disabled title="map selected box to nothing">&empty; none</button>
        <button id="leanClear" class="minibtn" disabled title="clear this box's Lean mapping">clear</button>
        <span class="vsep"></span>
        <button id="vOk" class="minibtn okbtn" disabled title="leaf verdict: faithful (click again to clear)">&check; ok</button>
        <button id="vNotok" class="minibtn notokbtn" disabled title="leaf verdict: not faithful (click again to clear)">&cross; not ok</button>
        <button id="vUndec" class="minibtn undecbtn" disabled title="leaf verdict: undecidable / working on it (click again to clear)">? undecidable</button>
      </span>
    </div>
    <div class="lean-info" id="leanInfo"></div>
    <div id="leanScroll" class="lean-scroll"><div id="leanCode" class="lean-code"></div></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
