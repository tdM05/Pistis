<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faithfulness labeler</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      onerror="window.__noKatex=true">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- markdown (NL side) and Lean syntax highlighting (formal side). All optional:
     if a CDN is unreachable the app falls back to plain text (see the __no* flags). -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" onerror="window.__noMarked=true"></script>
<script type="module">
  // Shiki gives the formal side authentic Lean-4 (VSCode) colours. It loads async;
  // formal nodes render as plain monospace first, then upgrade once it's ready.
  try{
    const { createHighlighter } = await import("https://esm.sh/shiki@1.24.0");
    window.__shiki = await createHighlighter({ themes:["github-light"], langs:["lean"] });
  }catch(e){ window.__noShiki=true; }
  if(window.shikiReady) window.shikiReady();
</script>
<style>
  :root { --ok:#178a3a; --bad:#c0332b; --hl:#cfe3ff; --hlc:#fde2b8; --border:#d5d7db;
          --mut:#666; --sfc:#2563eb; --snc:#c2790a; --cfc:#0f766e; --cnc:#7c3aed; --ic:#9333ea; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin:0; color:#111; }
  header { display:flex; gap:10px; align-items:center; padding:8px 14px;
           border-bottom:1px solid var(--border); position:sticky; top:0; background:#fafafa; z-index:20; flex-wrap:wrap; }
  header .grow { flex:1; }
  select,button,input,textarea { font:inherit; }
  button { cursor:pointer; border:1px solid var(--border); background:#fff; border-radius:6px; padding:4px 10px; }
  button.primary { background:#111; color:#fff; border-color:#111; }
  button:disabled { opacity:.4; cursor:default; }
  button.tiny { font-size:12px; padding:2px 8px; }
  .mut { color:var(--mut); font-size:12px; }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--border); }
  .pill.faithful { background:#e6f5ea; color:var(--ok); border-color:#bfe4c9; }
  .pill.unfaithful { background:#fbe9e7; color:var(--bad); border-color:#f0c4bf; }
  .pill.NaN { background:#eee; color:#555; }
  .pill.untargeted { background:#fff4e5; color:#a15c00; border-color:#f0d7ad; }
  #doneWrap { display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
  #doneWrap.on { background:#e6f5ea; color:var(--ok); border-color:#bfe4c9; }
  #cov.bad { background:#fdecec; color:#b42318; border-color:#f3b9b3; cursor:help; }

  /* ---------- two panels ----------
     LEFT: `Main.lean`, verbatim and complete (see proof_pane.js) — the proof is the index, so
     clicking a `pistis_` sentence right where it is written loads it.
     RIGHT: that unit's align-then-label view. The left panel scrolls on its own, so the proof stays
     put while you work; the right panel scrolls with the page, which is what drawEdges assumes.
     The divider between them is draggable (#split), so how much room each gets is the reader's call;
     `flex-basis` is set from JS, which is why the 46% here is only a default. */
  #layout { display:flex; align-items:flex-start; }
  #proof { flex:0 0 46%; min-width:0; background:#fcfcfc;
           position:sticky; top:47px; height:calc(100vh - 47px); overflow:auto; }
  #content { flex:1; min-width:0; }
  /* the drag handle: full height, sticky alongside the proof, and wider than it looks (the ::before
     bleeds a few px either side) so it can be grabbed without pixel-hunting */
  #split { flex:0 0 7px; position:sticky; top:47px; height:calc(100vh - 47px);
           cursor:col-resize; background:#f1f2f4; border-left:1px solid var(--border);
           border-right:1px solid var(--border); z-index:5; }
  /* bleeds to the RIGHT only: the proof pane's own scrollbar runs along the left edge of the handle
     and grabbing it must not start a resize */
  #split::before { content:""; position:absolute; inset:0 -5px 0 0; }
  #split::after { content:""; position:absolute; top:50%; left:1px; right:1px; height:26px;
                  margin-top:-13px; border-radius:3px; background:#c9ccd1; }
  #split:hover, #split.dragging { background:var(--hl); }
  #split:hover::after, #split.dragging::after { background:#5b82c9; }
  body.resizing { cursor:col-resize; user-select:none; }   /* no text selection mid-drag */
  .ptoolbar { position:sticky; top:0; z-index:3; display:flex; gap:8px; align-items:center;
              padding:6px 10px; background:#fcfcfc; border-bottom:1px solid var(--border); }
  .ptoolbar .grow { flex:1; }
  .pitem { padding:8px 0 14px; }
  .pitemhead { display:flex; gap:8px; align-items:baseline; padding:0 10px; }
  .pitemhead .grow { flex:1; }
  .pitemsub { padding:0 10px 7px; font-style:italic; }

  /* The file itself: one grid row per source line, the line number in its own gutter cell. Rows
     rather than a parallel column of numbers, because the text soft wraps (alt+Z, `.code` without
     `.nowrap`) — a wrapped line is taller than one row, so a separate gutter would drift out of
     step, while a per-line cell just grows with its line. `max-content max-content` in nowrap mode
     sizes the content column to the longest line, so the pane scrolls sideways instead; the gutter
     stays put through that because it is sticky. */
  .code { display:grid; grid-template-columns:max-content minmax(0,1fr); align-content:start;
          font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12.5px;
          line-height:1.65; tab-size:2; background:#fff; overflow-x:auto;
          border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .code.nowrap { grid-template-columns:max-content max-content; }
  .lnum { padding:0 8px 0 10px; color:#b0b4ba; text-align:right; background:#fbfbfc;
          border-right:1px solid #eef0f2; position:sticky; left:0; z-index:1;
          user-select:none; -webkit-user-select:none; }
  /* `--ind` (set per line by proof_pane.js) is that line's own indentation: as padding plus an equal
     and opposite text-indent it hangs the wrapped rows under the line's indent, the way VSCode's
     `wrappingIndent: same` does. Nothing wraps in nowrap mode, so there it is dropped — it would
     otherwise confuse the max-content sizing of the column. */
  .lsrc { white-space:pre-wrap; overflow-wrap:anywhere;
          padding:0 12px 0 calc(10px + var(--ind, 0px)); text-indent:calc(-1 * var(--ind, 0px)); }
  .code.nowrap .lsrc { white-space:pre; padding-left:10px; text-indent:0; }
  .lsrc:empty::after { content:"\00a0"; }   /* a blank line still occupies a row */
  /* the line a citation jump landed on. It stays marked rather than flashing: you jumped here to
     read the line, and a flash is over before a smooth scroll has settled. */
  .lsrc.lit { background:#fff6d6; box-shadow:inset 2px 0 0 0 #e0a800; }
  .lnum.lit { background:#fdf0c4; color:#8a6d00; font-weight:600; }

  /* The clickable things are a pistis tactic's head (keyword + loc + NL literal) and a
     `-- @pistis_assumption ("clause", TYPE)` marker. The marker is a unit like any other — its
     clause is an NL target and its type that clause's formalization — so it opens its own
     align-then-label view; it is tinted differently because it is a CONSUMED premise rather than
     something the segment asserts, and it reads as a comment in the source.
     `.hov` rather than `:hover`, because a region that spans lines is
     several <a>s and all of them should light up together (proof_pane.js sets it); `:hover` stays as
     the fallback if that listener never runs. */
  a.anchor { text-decoration:none; color:inherit; border-radius:3px; padding:1px 0;
             box-shadow:inset 0 -1px 0 rgba(0,0,0,.18); cursor:pointer; }
  a.anchor.hov, a.anchor:hover { box-shadow:inset 0 -2px 0 currentColor;
                                 filter:saturate(1.25) brightness(.97); }
  a.anchor.k-statement  { background:#fff4e0; }
  a.anchor.k-segment    { background:#e4edfd; }
  a.anchor.k-assumption { background:#e8f3e6; }
  a.anchor.nodp { background:repeating-linear-gradient(45deg,#fff4e5,#fff4e5 6px,#ffe9c9 6px,#ffe9c9 12px); }
  /* the unit the right panel is showing */
  a.anchor.cur { box-shadow:inset 0 0 0 2px #111; }

  /* source strip (where spans are made) */
  #source { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); }
  #source .card { border:1px solid var(--border); border-radius:10px; padding:8px 10px; min-width:0; }
  #source h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut);
               display:flex; gap:8px; align-items:center; }
  .lean { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12.5px; }
  .txt { white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; line-height:1.8;
         max-height:200px; overflow:auto; background:#fff; border:1px solid #eee; border-radius:6px; padding:6px 8px; }
  #TN { line-height:1.9; }
  #TN .katex-display { overflow-x:auto; overflow-y:hidden; }
  .mnode { cursor:default; display:inline-block; }
  .mnode.seg { cursor:pointer; }
  /* a display formula split at its span boundaries: the fragments are inline nodes, so they need a
     block of their own to sit centred in, the way \[…\] would. */
  .mdisp { display:block; text-align:center; margin:4px 0; overflow-x:auto; overflow-y:hidden; }
  .katex-display { margin:4px 0; }
  .seg { border-radius:3px; padding:1px 0; }
  /* each span gets its own colour (set inline, keyed by index); overlapping
     regions are striped with every covering span's colour. */
  .seg.sf, .seg.sn { cursor:pointer; }
  .seg.picked { outline:2px solid #111; }
  .seg.flash { animation:segflash 1.6s ease-out; }
  @keyframes segflash { 0%,40%{ background:#ffe08a; outline:2px solid #f0a800; } 100%{ background:transparent; outline:2px solid transparent; } }
  /* nodes flash red when localizing an unfaithful label's failing edges. */
  .node.flash { animation:nodeflash 1.6s ease-out; }
  @keyframes nodeflash { 0%,40%{ background:#fbe0dc; outline:2px solid var(--bad); } 100%{ background:transparent; outline:2px solid transparent; } }
  /* the ^index tag is a label, not part of the text -- don't let it be selected
     (that would corrupt the char offsets read from a selection). */
  .idxtag { font-size:9px; color:var(--mut); vertical-align:super; margin-left:1px;
            user-select:none; -webkit-user-select:none; pointer-events:none; }

  /* hint / connect bar */
  #hint { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
          padding:6px 16px; font-size:12px; color:var(--mut); background:#fafafa; border-bottom:1px solid var(--border); }
  #hint b { color:#111; }

  /* graph */
  #graph { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);
           padding:14px 16px 60px; align-items:start; }
  #edgeSvg { position:absolute; inset:0; pointer-events:none; z-index:3; }
  #edgeSvg path.hit { stroke:transparent; stroke-width:18; fill:none; pointer-events:stroke; cursor:pointer; }
  #edgeSvg path.wire { fill:none; stroke-width:2.5; }
  #edgeSvg path.wire.ok { stroke:var(--ok); }
  #edgeSvg path.wire.bad { stroke:var(--bad); }
  #edgeSvg path.wire.selw { stroke-width:6; }
  #edgeSvg path.hit:hover + path.wire { stroke-width:5; }
  .col { display:flex; flex-direction:column; gap:10px; z-index:1; }
  .colF { align-items:flex-end; text-align:right; }
  .colN { align-items:flex-start; }
  .colhead { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); font-weight:700; width:100%; }
  .colF .colhead { text-align:right; } .colN .colhead { text-align:left; }
  .grp { width:100%; display:flex; flex-direction:column; gap:6px; }
  .colF .grp { align-items:flex-end; } .colN .grp { align-items:flex-start; }
  .grplab { font-size:10px; color:var(--mut); font-weight:700; }
  .node { display:inline-flex; align-items:center; gap:8px; max-width:100%; border:1px solid var(--border);
          border-left-width:4px; border-radius:8px; padding:5px 9px; background:#fff; cursor:pointer;
          font-size:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .colN .node { border-left-width:1px; border-right-width:4px; }
  .node .ntext { white-space:pre-wrap; overflow-wrap:anywhere; max-width:300px; }
  /* an S_N card's pieces: the " … " between two intervals of a discontinuous span, and a TeX
     fragment that would not parse, left as its own source rather than silently dropped. */
  .node .pgap { color:var(--mut); }
  .node .rawtex { font-family:ui-monospace,monospace; font-size:11px; color:#555; }
  #covPanel { position:absolute; z-index:40; max-width:560px; max-height:320px; overflow:auto;
    background:#fff; border:1px solid #f3b9b3; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.14);
    padding:8px; font-size:12px; }
  #covPanel .chd { font-weight:600; color:#b42318; margin-bottom:6px; }
  #covPanel .crow { padding:4px 6px; border-radius:6px; cursor:pointer; display:flex; gap:8px; }
  #covPanel .crow:hover { background:#fdecec; }
  #covPanel .cwhere { color:var(--mut); flex:none; font-family:ui-monospace,monospace; }
  #covPanel .cwhat { overflow-wrap:anywhere; white-space:pre-wrap; }
  .node .nlab { font-size:10px; color:var(--mut); flex:none; }
  .node .dot { width:10px; height:10px; border-radius:50%; background:#9aa0a6; flex:none; }
  .node.picked { outline:2px solid #111; outline-offset:1px; }
  .node.picked .dot { background:#111; }
  .node .del { color:var(--mut); flex:none; cursor:pointer; padding:0 3px; border-radius:4px; font-weight:600; }
  .node .del:hover { color:#fff; background:#c0392b; }
  .node .edit { color:var(--mut); flex:none; cursor:pointer; padding:0 3px; border-radius:4px; font-size:11px; }
  .node .edit:hover { color:#fff; background:var(--sfc); }
  .n-sf { border-left-color:var(--sfc); } .colN .n-sf{border-right-color:var(--sfc);}
  .n-sn { border-right-color:var(--snc); }
  .n-cf { border-left-color:var(--cfc); font-family:ui-monospace,monospace; }
  .n-cn { border-right-color:var(--cnc); }
  .n-i  { border-right-color:var(--ic); }
  .node .src { display:block; color:var(--mut); font-size:10.5px; }
  /* a `Main.lean:46` citation: clicking it jumps the proof panel to that line (alt+← comes back).
     A citation that resolves to nothing is struck through rather than left looking live. */
  .node .cite { cursor:pointer; text-decoration:underline dotted #9aa0a6; }
  .node .cite:hover { color:var(--cfc); text-decoration-color:currentColor; }
  .node .badcite { color:var(--bad); text-decoration:line-through; }
  .node .pieces { display:flex; flex-wrap:wrap; gap:3px; margin-top:3px; }
  .node .piece { display:inline-flex; align-items:center; gap:2px; font-size:9.5px; line-height:1.4;
                 background:#eef0f3; border-radius:4px; padding:0 2px 0 4px; color:#444;
                 font-family:ui-monospace,monospace; }
  .node .piece .prm { cursor:pointer; color:var(--mut); padding:0 2px; border-radius:3px; }
  .node .piece .prm:hover { color:#fff; background:#c0392b; }
  .node .botmark { flex:none; color:var(--mut); opacity:.5; font-size:11px; margin-left:2px; cursor:pointer; }
  .node .botmark.bad { color:#fff; background:var(--bad); opacity:1; font-weight:800; font-size:14px;
                       padding:0 5px; border-radius:4px; }
  .cf-hint { font-size:11px; color:var(--mut); font-style:italic; text-align:right; max-width:260px; }

  /* edge menu (popup on click) */
  #edgeMenu { position:fixed; z-index:50; width:480px; max-width:calc(100vw - 20px); background:#fff; border:1px solid var(--border);
              border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.2); padding:12px; display:flex;
              flex-direction:column; gap:10px; }
  #edgeMenu[hidden] { display:none; }
  #edgeMenu .mends { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; }
  #edgeMenu .ref { background:#eef0f3; border-radius:5px; padding:1px 7px; }
  #edgeMenu .mtoggle { display:flex; gap:6px; }
  #edgeMenu .mtoggle button { flex:1; }
  #edgeMenu .mtoggle button.on[data-v="1"] { background:var(--ok); color:#fff; border-color:var(--ok); }
  #edgeMenu .mtoggle button.on[data-v="0"] { background:var(--bad); color:#fff; border-color:var(--bad); }
  #edgeMenu textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:8px;
                       min-height:150px; font-size:13px; line-height:1.55; resize:vertical; }
  #edgeMenu .mrow { display:flex; justify-content:space-between; }
  #edgeMenu .mdel { color:var(--bad); border-color:#f0c4bf; }

  /* targets editor */
  #targets { padding:22px; max-width:900px; margin:0 auto; }
  #targets .field { margin-bottom:16px; }
  #targets label { display:block; font-weight:600; margin-bottom:4px; }
  #targets textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:8px; }
  #targets textarea.mono { font-family:ui-monospace,monospace; font-size:13px; }
  .banner { background:#fff4e5; border:1px solid #f0d7ad; color:#7a4600; border-radius:8px; padding:10px 12px; margin-bottom:16px; }
  .err { background:#fbe9e7; border:1px solid #f0c4bf; color:var(--bad); border-radius:8px; padding:8px 12px; margin-top:8px; white-space:pre-wrap; font-size:12px; }
  .cnform { border:1px dashed var(--border); border-radius:6px; padding:8px; margin:6px 0; background:#fff; text-align:left; width:100%; }
  .cnform textarea, .cnform input { width:100%; border:1px solid var(--border); border-radius:6px; padding:4px 6px; margin-bottom:4px; }

  /* rich node bodies (BOTH modes): markdown output + KaTeX + Shiki-highlighted Lean */
  .node .ntext p { margin:0; }
  .node .ntext p + p { margin-top:4px; }
  .node .ntext ul, .node .ntext ol { margin:2px 0; padding-left:18px; }
  .node .ntext .katex-display { margin:4px 0; }
  .node .ntext code { font-family:ui-monospace,monospace; }
  .node .ntext .shiki, .node .ntext .shiki code {
    background:transparent !important; margin:0; padding:0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px;
    white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <span class="mut" id="curpath"></span>
  <label id="doneWrap" class="pill" title="mark this datapoint done"><input type="checkbox" id="doneChk"> done</label>
  <span id="label" class="pill"></span>
  <span class="mut" id="derived"></span>
  <span id="cov" class="pill" hidden></span>
  <span class="grow"></span>
  <span class="mut" id="pin"></span>
  <button id="undo" class="tiny" disabled>↶ undo</button>
  <button id="editTargets" class="tiny" style="display:none">edit targets</button>
  <button id="reload" class="tiny">reload</button>
  <button id="save" class="primary">Save</button>
</header>
<div id="covPanel" hidden></div>

<div id="layout">
<!-- left panel: Main.lean, verbatim; filled by proof_pane.js -->
<aside id="proof"><div class="mut" style="padding:12px">loading the proof…</div></aside>
<div id="split" title="drag to resize · double-click to reset"></div>
<div id="content">

<!-- targets editor -->
<div id="targets" style="display:none">
  <div class="banner" id="tBanner"></div>
  <div class="field">
    <label>T_F — formal statement (Lean); normalized to one flowing declaration</label>
    <textarea id="tTF" class="mono" rows="10" placeholder="import Mathlib&#10;open ...&#10;theorem foo ... := by sorry"></textarea>
  </div>
  <div class="field">
    <label>T_N — natural-language statement (may contain $LaTeX$)</label>
    <textarea id="tTN" rows="6" placeholder="Suppose ... Prove that ..."></textarea>
  </div>
  <button id="setTargets" class="primary">Set targets &amp; derive C_F</button>
  <button id="cancelTargets" class="tiny">cancel</button>
  <span class="mut" id="tStatus" style="margin-left:10px"></span>
  <div id="tErr"></div>
</div>

<!-- graph view -->
<div id="view" style="display:none">
  <section id="source">
    <div class="card">
      <h3>T_F <button class="tiny" id="addSF">+ S_F span</button></h3>
      <div id="TF" class="txt lean"></div>
    </div>
    <div class="card">
      <h3>T_N <button class="tiny" id="addSN">+ S_N span</button></h3>
      <div id="TN" class="txt"></div>
    </div>
  </section>

  <div id="hint"></div>

  <section id="graph">
    <svg id="edgeSvg"></svg>
    <div class="col colF" id="colF"></div>
    <div class="col" style="z-index:1"></div>   <!-- gutter (edges draw here) -->
    <div class="col colN" id="colN"></div>
  </section>
</div>

</div><!-- /content -->
</div><!-- /layout -->

<!-- edge popup menu -->
<div id="edgeMenu" hidden>
  <div class="mends"></div>
  <div class="mtoggle">
    <button data-v="1">λ = 1 &nbsp;ok</button>
    <button data-v="0">λ = 0 &nbsp;not ok</button>
  </div>
  <textarea class="mreason" placeholder="reason"></textarea>
  <div class="mrow"><button class="mdel tiny">delete edge</button><button class="mclose tiny">close</button></div>
</div>

<!-- the left panel. Loaded first so `ProofPane` exists by the time the script below boots. -->
<script src="/proof_pane.js"></script>
<script>
const $ = s => document.querySelector(s);
const BOT = "⊥";
let B=null, sel={f:null,n:null}, selEdge=null, menuEdge=null, dirty=false;
let undoStack=[], reasonPushed=false;
let dpList=[];

// ---------- refs ----------
const endpointParts=ref=>ref?.parts||[ref];
const refKey=ref=>ref?.parts?JSON.stringify(ref.parts.map(p=>JSON.stringify(p)).sort()):JSON.stringify(ref);
const refEq=(a,b)=>refKey(a)===refKey(b);
const refsOverlap=(a,b)=>endpointParts(a).some(p=>endpointParts(b).some(q=>refEq(p,q)));
function mixedEndpoints(){
  const refs=[];
  B.lambda.forEach(([edge])=>{if(edge[0]?.parts&&!refs.some(ref=>refEq(ref,edge[0])))refs.push(edge[0]);});
  return refs;
}
function formalEndpointText(ref){
  return endpointParts(ref).map(([kind,i])=>kind==="S_F"?spanText(B.T_F,B.S_F[i]):B.C_F.items[i].signature||"").join("\n…\n");

    document.querySelectorAll("[data-ref]").forEach(e=>{ if(refEq(JSON.parse(e.dataset.ref),r)) e.classList.add("picked"); });
    document.querySelectorAll("[data-covers]").forEach(e=>{ if(JSON.parse(e.dataset.covers).some(c=>refsOverlap(c,r))) e.classList.add("picked"); });
  });
  const h=$("#hint"); h.innerHTML="";
  const both=sel.f&&sel.n&&!(sel.f===BOT&&sel.n===BOT);
  if(both){
    h.innerHTML=`Connect <b>${escapeHtml(refLabel(sel.f))}</b> ↔ <b>${escapeHtml(refLabel(sel.n))}</b>? `;
    const c=document.createElement("button"); c.className="primary tiny"; c.textContent="Connect"; c.onclick=doConnect;
    const x=document.createElement("button"); x.className="tiny"; x.textContent="clear"; x.onclick=clearSel;
    h.append(c,x);
  } else if(sel.f||sel.n){
    const have=sel.f?refLabel(sel.f):refLabel(sel.n), need=sel.f?"NL":"Formal";
    h.innerHTML=`Selected <b>${escapeHtml(have)}</b> — click a node on the <b>${need}</b> side. `;
    const x=document.createElement("button"); x.className="tiny"; x.textContent="clear"; x.onclick=clearSel; h.append(x);
  } else {
    h.innerHTML=`Click a <b>Formal</b> node and an <b>NL</b> node, then <b>Connect</b>. Click an edge to edit · double-click a C_N/I node to edit · select text then <b>✎</b> to re-point a span, or <b>+piece</b> to add a discontinuous piece.`;
  }
}

// lambda index of a vertex's edge to ⊥ (its "unmatched" mapping), else -1.
function botEdge(ref){
  if(ref===BOT) return -1;
  const formal=!!ref.parts||ref[0]==="S_F"||ref[0]==="C_F";
  return B.lambda.findIndex(e=>{
    const near=formal?e[0][0]:e[0][1], far=formal?e[0][1]:e[0][0];
    return refEq(near,ref) && far===BOT;
  });
}
// A `path:line` citation, as a chip under a context card. Clicking it jumps the LEFT panel to that
// line -- same tab, no navigation: the proof panel already holds the whole file, and that is the
// place the citation is talking about. alt+← (or the pane's ← button) comes back.
//
// A citation is only drawn as a live link when it resolves. The proof panel is asked, so the three
// outcomes stay distinct: a line that exists is clickable; a file that IS on the page but has no such
// line is struck through, which is what a stale citation looks like after the proof is edited; a file
// that is not on the page at all (`Mathlib/…`, upstream's usual provenance) is plain text, since it
// is real provenance that simply cannot be jumped to here. `check_citations.py` makes the same
// distinctions offline, and also checks the signature the line carries.
//
// `file.lean:37-38` cites a range, for a record read off more than one line: `have h : ¬P := by` /
// `intro hp` writes P on the first and binds hp on the second. Both lines are marked by the jump,
// because both are what the item is quoting.
const LEAN_CITE=/^(\S+\.lean):(\d+)(?:-(\d+))?$/;
function citeEl(src){
  const el=document.createElement("span"); el.className="src"; el.textContent=src;
  const m=LEAN_CITE.exec(String(src||"").trim());
  const lo=m?+m[2]:0, hi=m&&m[3]?+m[3]:lo;
  const at=m&&window.ProofPane&&ProofPane.locate?ProofPane.locate(m[1],lo):null;
  const end=m&&window.ProofPane&&ProofPane.locate?ProofPane.locate(m[1],hi):null;
  if(!m||!at||!at.file){ if(m) el.title=m[1]+" is not the file shown in the proof panel"; return el; }
  if(!at.row||!end.row){ el.classList.add("badcite");
    el.title=`${m[1]} has ${at.lines} line(s) — there is no line ${hi>lo?hi:lo}`; return el; }
  el.classList.add("cite");
  el.title=`jump the proof to ${src}  (alt+← comes back)`;
  el.onclick=(e)=>{ e.stopPropagation(); ProofPane.revealLine(m[1],lo,hi); };
  return el;
}
function mkNode(side,ref,cls,label,text,sub,opts){

  node.onclick=()=>clickNode(side,ref);
  if(opts.onEdit) node.ondblclick=(e)=>{e.stopPropagation();opts.onEdit();};
  const dot=document.createElement("span"); dot.className="dot";
  // a vertex whose only mapping is to ⊥ shows a clickable ⊥ beside its dot,
  // instead of a wire. (invariant: no ⊥ edge coexists with a real edge.)
  let botMark=null; const bi=botEdge(ref);

    botMark=document.createElement("span");

  }

  if((cls||"").indexOf("n-bot")>=0) t.textContent=text;   // ⊥ node: no rich render

      const rm=document.createElement("span"); rm.className="prm"; rm.textContent="×"; rm.title="remove this piece";
      rm.onmousedown=e=>e.preventDefault();
      rm.onclick=e=>{e.stopPropagation();p.onRemove();}; chip.appendChild(rm); pc.appendChild(chip); });
    body.appendChild(pc);
  }
  const parts=[lab,body];

    p.title="append the current text selection to this span as another piece";
    p.onmousedown=e=>e.preventDefault();
    p.onclick=e=>{e.stopPropagation();opts.onAddPiece();}; parts.push(p); }
  if(opts.onEditSpan){ const p=document.createElement("span"); p.className="edit"; p.textContent="✎";
    p.title="re-point this whole span to the current text selection";

    p.onclick=e=>{e.stopPropagation();opts.onEditSpan();}; parts.push(p); }
  // context items (C_N / C_F / I) are edited via a visible button, not just dblclick.
  if(opts.onEdit){ const p=document.createElement("span"); p.className="edit"; p.textContent="✎";
    p.title="edit this item";
    p.onclick=e=>{e.stopPropagation();opts.onEdit();}; parts.push(p); }
  if(opts.onDel){ const x=document.createElement("span"); x.className="del"; x.textContent="✕";
    x.onclick=e=>{e.stopPropagation();opts.onDel();}; parts.push(x); }
  if(side==="f"){ parts.forEach(p=>node.appendChild(p)); if(botMark)node.appendChild(botMark); node.appendChild(dot); }
  else { node.appendChild(dot); if(botMark)node.appendChild(botMark); parts.forEach(p=>node.appendChild(p)); }
  return node;
}
function group(col,label){

function renderColumns(){

  B.C_N.forEach((it,i)=>gCN.appendChild(mkNode("n",["C_N",i],"n-cn","",it.text||"","",

function closeCF(){ const m=$("#cfPicker"); if(m) m.remove(); }
// add / (when idx given) edit a C_F clause -- a plain manual paste, like a C_N item: you select the

// fields, and both are a quotation: the TEXT must be in the file word for word (`check_verbatim.py`
// rejects it otherwise, including a plausible `name : type` stitched out of two halves that are
// each there), and the SOURCE says which line(s) it is read off, which is where the chip jumps to.
function openCFform(g, idx){
  const it=(idx!=null?(B.C_F.items||[])[idx]:null)||{signature:"",source:""};
  const box=document.createElement("div"); box.className="cnform";
  const sig=document.createElement("textarea"); sig.rows=4;
  sig.placeholder="the clause, verbatim from the proof (e.g. obtain ⟨τ, hτ⟩ : ∃ τ : ℝ, τ ≠ 0)";
  sig.value=it.signature||"";
  const src=document.createElement("input");
  src.placeholder="source — the line(s) it is written on, e.g. items/item1/Main.lean:46";
  src.value=it.source||"";
  const add=document.createElement("button"); add.className="primary tiny"; add.textContent=(idx!=null?"save":"add");
  add.onclick=()=>{ const sg=sig.value, so=src.value.trim(); if(!sg.trim()) return;
    pushUndo();
    const rec={...it, signature:sg, kind:it.kind||""};
    delete rec.name;
    if(so||"source" in it||idx==null)rec.source=so;
    if(sg!==it.signature){ delete rec.pieces; }
    if(idx!=null) B.C_F.items[idx]=rec; else { B.C_F.items=B.C_F.items||[]; B.C_F.items.push(rec); }
    markDirty(); render(); };
  const cancel=document.createElement("button"); cancel.className="tiny"; cancel.textContent="cancel"; cancel.onclick=()=>render();
  box.appendChild(sig); box.appendChild(src);
  const row=document.createElement("div"); row.appendChild(add); row.appendChild(cancel); box.appendChild(row);
  g.appendChild(box); sig.focus();
}
// Complete-coverage annotations require every target region to be covered.
function covGaps(){
  const out=[];
  if(B.format?.coverage==="selective") return out;
  [["f",B.T_F,B.S_F],["n",B.T_N,B.S_N]].forEach(([side,text,spans])=>{
    if(text==null) return;
    const n=text.length, cov=new Uint8Array(n);
    (spans||[]).forEach(sp=>sp.forEach(([s,e])=>{ for(let i=Math.max(0,s);i<Math.min(n,e);i++) cov[i]=1; }));
    let i=0;
    while(i<n){
      if(cov[i]){ i++; continue; }
      let j=i; while(j<n&&!cov[j]) j++;
      const chunk=text.slice(i,j);
      if(chunk.trim()!=="") out.push({side,start:i,end:j,text:chunk});
      i=j;
    }
  });
  return out;
}
function gapLines(gaps){
  return gaps.map(g=>`${g.side==="f"?"T_F":"T_N"} [${g.start},${g.end}) ${JSON.stringify(g.text)}`).join("\n");
}
function doneErrors(){
  const gaps=covGaps();
  return gaps.length?["Complete coverage is required before done.\n"+gapLines(gaps)]:[];
}
function renderCoverage(){
  const el=$("#cov"); if(!el) return [];
  const gaps=covGaps();
  if(!gaps.length){ el.hidden=true; el.textContent=""; el.classList.remove("bad"); closeCovPanel(); return gaps; }
  el.hidden=false; el.classList.add("bad");
  el.textContent=`⚠ ${gaps.length} uncovered`;

}
function fillCovPanel(gaps){

function toggleCovPanel(gaps){

function closeCovPanel(){ const p=$("#covPanel"); if(p) p.hidden=true; }
// scroll the offending text into view and flash the segment containing the gap
function revealGap(g){
  const host=$(g.side==="f"?"#TF":"#TN"); if(!host) return;
  host.scrollIntoView({block:"center",behavior:"smooth"});
  const seg=[...host.querySelectorAll(".seg")].find(s=>{
    const a=+s.dataset.start; if(isNaN(a)) return false;
    const b=s.dataset.end!==undefined?+s.dataset.end:a+s.textContent.length;
    return a<=g.start && g.start<b;

function renderLabel(){
  // label is fully DERIVED from (R,λ): faithful iff every λ=1, unfaithful iff any
  // λ=0, NaN if no verdicts are defined. Never stored by hand.
  const d=!B.lambda.length?"NaN":(B.lambda.some(e=>e[1][0]===0)?"unfaithful":"faithful");
  const el=$("#label"); el.className="pill "+d; el.textContent=d; B.label=d;
  const failing=B.lambda.filter(e=>e[1][0]===0);
  $("#derived").textContent=`${B.lambda.length} edges`
    +(d==="unfaithful"?` · ${failing.length} failing`:"");
  // localize WHY: hovering an unfaithful label lists {r∈R : λ(r)₁=0}, each edge
  // pointing to WHERE it failed and λ(r)₂ saying WHY. Also flash those edges on hover.
  if(d==="unfaithful"){
    el.title=`unfaithful — ${failing.length} failing edge${failing.length>1?"s":""} `
      +`(λ=0):\n`+failing.map(([[f,n],[,why]])=>
        `• ${refLabel(f)} ↔ ${refLabel(n)}\n    ${why?why:"(no reason given)"}`).join("\n");
    el.onmouseenter=()=>failing.forEach(([[f,n]])=>{ flashRef(f); flashRef(n); });
  } else {
    el.title=d==="faithful"

// briefly highlight the node for a ref (skips ⊥, which has no node).
function flashRef(ref){
  if(ref===BOT) return;
  const el=nodeEl(ref); if(!el) return;
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1600);
}

// ---------- edges in the gutter ----------
function nodeEl(ref,side){
  const els=[...document.querySelectorAll("#graph [data-ref]")]
    .filter(e=>refEq(JSON.parse(e.dataset.ref),ref));
  if(els.length<2||!side) return els[0]||null;
  // ⊥ appears once per column; pick the one on the endpoint's own side so a
  // formal endpoint's ⊥ sits in F and an NL endpoint's ⊥ sits in N.
  return els.find(e=>e.closest(side==="f"?"#colF":"#colN"))||els[0];
}
function dotCenter(ref,side){
  const el=nodeEl(ref,side); if(!el) return null;
  const dot=el.querySelector(".dot"); const r=(dot||el).getBoundingClientRect();
  const s=$("#edgeSvg").getBoundingClientRect();
  return { x:r.left+r.width/2-s.left, y:r.top+r.height/2-s.top };
}
function drawEdges(){
  const svg=$("#edgeSvg"), g=$("#graph"); if(!svg||!g) return;
  svg.setAttribute("width",g.offsetWidth); svg.setAttribute("height",g.offsetHeight);
  svg.innerHTML="";
  B.lambda.forEach((entry,i)=>{
    const [[f,n],[v]]=entry;
    if(f===BOT || n===BOT) return;        // ⊥ is a node badge, not a wire
    const a=dotCenter(f,"f"), b=dotCenter(n,"n");
    if(!a||!b) return;
    // control points curve toward each other; signed so it works whichever side (F or N) is left.
    const dx=Math.sign(b.x-a.x||1)*Math.max(40,Math.abs(b.x-a.x)/2);
    const d=`M ${a.x} ${a.y} C ${a.x+dx} ${a.y} ${b.x-dx} ${b.y} ${b.x} ${b.y}`;
    const hit=svgEl("path"); hit.setAttribute("d",d); hit.setAttribute("class","hit");
    hit.onclick=(ev)=>openMenu(i,ev.clientX,ev.clientY);
    const wire=svgEl("path"); wire.setAttribute("d",d);
    wire.setAttribute("class","wire "+(v?"ok":"bad")+(i===selEdge?" selw":""));
    svg.appendChild(hit); svg.appendChild(wire);
  });
}
function svgEl(t){ return document.createElementNS("http://www.w3.org/2000/svg",t); }

// ---------- edge popup menu ----------

  });
  const ta=m.querySelector(".mreason"); ta.value=reason||"";
  ta.onfocus=()=>{ if(!reasonPushed){ pushUndo(); reasonPushed=true; } };
  ta.oninput=()=>{ entry[1][1]=ta.value; markDirty(); };
  // a ⊥ edge can't be deleted -- ensureBotEdges would just re-create it (every
  // vertex keeps its line). Hide the delete button so it isn't misleading.
  const del=m.querySelector(".mdel"), isBot=(f===BOT||n===BOT);
  del.style.display=isBot?"none":"";
  del.onclick=()=>{ pushUndo(); B.lambda.splice(i,1); syncR(); closeMenu(); render(); };
  m.querySelector(".mclose").onclick=closeMenu;
  m.hidden=false;
  const w=m.offsetWidth||480, h=m.offsetHeight||300;
  m.style.left=Math.max(8,Math.min(x, window.innerWidth-w-10))+"px";
  m.style.top =Math.max(8,Math.min(y, window.innerHeight-h-10))+"px";
  drawEdges();
}
function closeMenu(){ $("#edgeMenu").hidden=true; menuEdge=null; selEdge=null; drawEdges(); }

// ---------- edit ops ----------
let saveTimer=null;
function markDirty(){ dirty=true;
  // any edit invalidates a prior "done" -- done is manual-only and must be
  // re-checked by hand after edits, never carried over (or re-set) automatically.
  if(B&&B.done){ B.done=false; setDoneUI(false); }
  scheduleSave(); }
// autosave: persist this datapoint shortly after any edit (debounced).
function scheduleSave(){
  if(!B||!B.has_targets) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(dirty) save(); }, 700);
}
function syncR(){ B.R=B.lambda.map(e=>e[0]); }
function deleteElem(set,i){
  const remap=ref=>{
    if(ref===BOT)return ref;
    if(ref.parts){
      const parts=ref.parts.map(remap).filter(p=>p!==null);
      return parts.length>1?{parts}:parts[0]||null;
    }
    if(ref[0]!==set)return ref;
    return ref[1]===i?null:[set,ref[1]-(ref[1]>i?1:0)];
  };
  B.lambda=B.lambda.flatMap(([edge,judgment])=>{
    const mapped=edge.map(remap);
    return mapped.includes(null)?[]:[[mapped,judgment]];
  });
  (set==="C_F"?B.C_F.items:B[set]).splice(i,1);
}
function removeElem(set,i){
  pushUndo();

  deleteElem(set,i);
  syncR(); sel={f:null,n:null}; closeMenu(); markDirty(); render();
}
function createEdge(f,n){
  if(f===BOT&&n===BOT) return;
  if(f!==BOT&&(!endpointParts(f).every(p=>Array.isArray(p)&&p.length===2&&["S_F","C_F"].includes(p[0])&&Number.isInteger(p[1])&&p[1]>=0)||
    f.parts&&(f.parts.length<2||new Set(f.parts.map(refKey)).size!==f.parts.length))) return;
  if(n!==BOT&&!["S_N","C_N","I"].includes(n[0])) return;
  if(B.lambda.some(e=>refEq(e[0][0],f)&&refEq(e[0][1],n))) return;
  // A real link means neither endpoint is unmatched: drop any stale ⊥ edge left on
  // either side so no phantom ⊥ coexists with the wire. This is the only place a
  // real link ever lands on a vertex, so enforcing it here makes the "edge AND ⊥ on
  // the same vertex" state unreachable -- no render-time reconciliation needed.
  if(f!==BOT&&n!==BOT) B.lambda=B.lambda.filter(e=>!(refEq(e[0][0],f)&&e[0][1]===BOT)&&!(e[0][0]===BOT&&refEq(e[0][1],n)));
  B.lambda.push([[f,n],[B.format?.coverage==="selective"&&f===BOT&&n!==BOT&&["C_N","I"].includes(n[0])?0:1,""]]); syncR(); markDirty(); render();
}
// Coverage only: every required vertex must map to something, so give any vertex
// that has NO edge at all a ⊥ ("unmatched") edge. This function only ADDS to
// genuinely edge-less vertices -- it never rewrites or removes existing edges, so
// merely viewing a datapoint never mutates its stored relation. The no-coexistence
// invariant (a vertex with a real link must never also carry a ⊥ edge) is enforced
// at the source in createEdge, where connecting a real link drops any stale ⊥.
function ensureBotEdges(){
  let changed=false; const isBot=x=>x===BOT;
  const fix=(kind,slot,count,mkBot)=>{
    for(let k=0;k<count;k++){
      const covered=B.lambda.some(e=>!isBot(e[0][slot])&&endpointParts(e[0][slot]).some(ref=>ref[0]===kind&&ref[1]===k));
      if(!covered){ B.lambda.push([mkBot(k),[B.format?.coverage==="selective"&&["C_N","I"].includes(kind)?0:1,""]]); changed=true; }
    }
  };
  // LCS formal-context items may be linked but need no exhaustive edge cover.
  // Other datasets give each curated C_F item an explicit edge.
  fix("S_F",0,B.S_F.length,k=>[["S_F",k],BOT]);
  if(B.format?.coverage!=="selective") fix("C_F",0,((B.C_F&&B.C_F.items)||[]).length,k=>[["C_F",k],BOT]);
  fix("S_N",1,B.S_N.length,k=>[BOT,["S_N",k]]);
  fix("C_N",1,B.C_N.length,k=>[BOT,["C_N",k]]);
  fix("I",1,B.I.length,k=>[BOT,["I",k]]);
  if(changed) syncR();
  return changed;
}
// add or (when idx given) edit an implicit assumption -- inline form, no
// window.prompt (blocked in some embedded browsers, e.g. VS Code Simple Browser).
function openIform(g, idx){
  const box=document.createElement("div"); box.className="cnform";
  const text=document.createElement("textarea"); text.rows=2;
  text.placeholder="implicit assumption"; text.value=(idx!=null?B.I[idx]:"");
  const add=document.createElement("button"); add.className="primary tiny";
  add.textContent=(idx!=null?"save":"add");
  add.onclick=()=>{ const v=text.value.trim(); if(!v)return; pushUndo();
    if(idx!=null) B.I[idx]=v; else B.I.push(v); markDirty(); render(); };
  const cancel=document.createElement("button"); cancel.className="tiny";
  cancel.textContent="cancel"; cancel.onclick=()=>render();
  box.appendChild(text);
  const row=document.createElement("div"); row.appendChild(add); row.appendChild(cancel); box.appendChild(row);
  g.appendChild(box); text.focus();
}
// add or (when idx given) edit a C_N context item -- inline form, no
// window.prompt (blocked in some embedded browsers, e.g. VS Code Simple Browser).
function openCNform(g, idx){
  const it=(idx!=null?B.C_N[idx]:null)||{text:"",source:""};
  if(it.pieces)return;
  const box=document.createElement("div"); box.className="cnform";
  const text=document.createElement("textarea"); text.rows=2; text.placeholder="what it is (definition / fact)";
  text.value=it.text||"";
  const src=document.createElement("input"); src.placeholder="source — where from, incl. page";
  src.value=it.source||"";
  const add=document.createElement("button"); add.className="primary tiny"; add.textContent=(idx!=null?"save":"add");
  add.onclick=()=>{ if(!text.value.trim())return; pushUndo();
    const rec={...it,text:text.value.trim(),source:src.value.trim()};
    if(idx!=null) B.C_N[idx]=rec; else B.C_N.push(rec);
    markDirty(); render(); };
  const cancel=document.createElement("button"); cancel.className="tiny"; cancel.textContent="cancel"; cancel.onclick=()=>render();
  box.appendChild(text); box.appendChild(src);
  const row=document.createElement("div"); row.appendChild(add); row.appendChild(cancel); box.appendChild(row);
  g.appendChild(box); text.focus();
}

// ---------- targets ----------
function showTargets(prefill){
  $("#view").style.display="none"; $("#targets").style.display="block";
  $("#tBanner").textContent=B.has_targets?`Editing targets for ${B.path}. Re-setting T_F re-derives C_F.`
    :`${B.path} has no targets yet. Paste T_F and T_N, then set them.`;
  $("#tTF").value=prefill?B.T_F:""; $("#tTN").value=prefill?B.T_N:"";
  $("#tStatus").textContent=""; $("#tErr").innerHTML="";
  // cancel only makes sense once targets exist (else there's no graph to go back
  // to -- the datapoint is still empty).
  $("#cancelTargets").style.display=B.has_targets?"inline-block":"none";
}
function showGraph(){
  $("#targets").style.display="none"; $("#view").style.display="block";
  $("#editTargets").style.display="inline-block";
  sel={f:null,n:null}; closeMenu(); render();
}
async function setTargets(){
  $("#tStatus").textContent="normalizing targets…"; $("#tErr").innerHTML="";
  const r=await fetch("/api/targets?path="+encodeURIComponent(B.path),{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({T_F:$("#tTF").value,T_N:$("#tTN").value})});
  const j=await r.json();
  if(j.error){ $("#tErr").innerHTML=`<div class="err">${escapeHtml(j.error)}</div>`; $("#tStatus").textContent=""; return; }
  B=j.bundle; B.R=B.R||[]; B.lambda=B.lambda||[]; undoStack=[]; $("#undo").disabled=true;
  $("#pin").textContent=(B.C_F.pin&&B.C_F.pin.toolchain)||"";
  if(j.cf_error) $("#tErr").innerHTML=`<div class="err">C_F not derived (targets saved):\n${escapeHtml(j.cf_error)}</div>`;
  $("#tStatus").textContent="done ✓"; dirty=false; showGraph(); refreshList();
}

// ---------- load / save ----------
function urlPath(){ return new URLSearchParams(location.search).get("path"); }
function setDoneUI(v){ $("#doneChk").checked=!!v; $("#doneWrap").classList.toggle("on",!!v); }
// the flat datapoint list, used only to tell whether a `?path=` actually exists on disk.
async function refreshList(){
  const r=await fetch("/api/datapoints"); dpList=await r.json(); return dpList;
}
// a click in the left panel. Switching units in place would silently drop unsaved edits, which
// navigating away used to be protected from by the beforeunload guard -- so ask.
async function openUnit(path){
  if(path===(B&&B.path)) return;
  if(dirty && !confirm("This unit has unsaved changes. Discard them?")) return;
  await loadDP(path);
}
async function loadList(){
  const list=await refreshList(); if(!list.length) return;
  const want=urlPath();
  await loadDP(want&&list.some(d=>d.path===want)
               ? want
               : (ProofPane.firstPath()||list[0].path));   // default to the first unit in PROOF order
}
async function loadDP(path){
  const r=await fetch("/api/datapoint?path="+encodeURIComponent(path));
  B=await r.json(); B.R=B.R||[]; B.lambda=B.lambda||[];
  $("#pin").textContent=(B.C_F.pin&&B.C_F.pin.toolchain)||"";
  sel={f:null,n:null}; selEdge=null; dirty=false; closeCF(); undoStack=[]; $("#undo").disabled=true;
  history.replaceState(null,"","?path="+encodeURIComponent(path));
  $("#curpath").textContent=path; setDoneUI(B.done);
  closeMenu();
  if(B.has_targets){ $("#label").className="pill"; showGraph(); }
  else{ $("#editTargets").style.display="none"; $("#label").className="pill untargeted";
    $("#label").textContent="no targets"; $("#derived").textContent=""; showTargets(false); }
  ProofPane.setCurrent(path);   // last: purely cosmetic, so it can't get in the way of the load
}
async function save(){
  if(!B.has_targets){ alert("Set the targets first."); return; }
  syncR();
  try{
    const r=await fetch("/api/save?path="+encodeURIComponent(B.path),{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({S_F:B.S_F,S_N:B.S_N,C_F:B.C_F,C_N:B.C_N,nl_context:B.nl_context,I:B.I,R:B.R,lambda:B.lambda,label:B.label,done:B.done})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"Save rejected");
    $("#save").textContent="Saved ✓"; $("#save").title=""; dirty=false;
    // the proof pane carries the progress count, so re-read it: this unit now counts as done, and
    // its hover title carries the label the server derived.
    ProofPane.refresh();
    setTimeout(()=>$("#save").textContent="Save",1200);
  }catch(error){
    dirty=true; if(B.done){B.done=false;setDoneUI(false);}
    $("#save").textContent="Save failed"; $("#save").title=String(error);
  }
}

// ---------- wire up ----------
$("#doneChk").onchange=()=>{ if(!B) return;
  if($("#doneChk").checked){
    const errors=doneErrors();
    if(errors.length){alert("Cannot mark done:\n"+errors.join("\n"));setDoneUI(false);return;}
  }
  B.done=$("#doneChk").checked;setDoneUI(B.done);save(); };
$("#reload").onclick=()=>loadDP(B.path);
$("#save").onclick=save;
$("#undo").onclick=undo;
$("#editTargets").onclick=()=>showTargets(true);
$("#setTargets").onclick=setTargets;
$("#cancelTargets").onclick=()=>{ if(B.has_targets) showGraph(); };
$("#addSF").onclick=()=>addSpanFrom("#TF","S_F");
$("#addSN").onclick=()=>addSpanFrom("#TN","S_N");
document.addEventListener("mousedown",e=>{
  const p=$("#covPanel");
  if(p&&!p.hidden&&!p.contains(e.target)&&e.target!==$("#cov")) closeCovPanel();
  const m=$("#edgeMenu"); if(m.hidden) return;
  if(m.contains(e.target)||e.target.closest("#edgeSvg")) return;
  closeMenu();
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){
    const t=document.activeElement;
    if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT")) return;   // let native undo run in fields
    e.preventDefault(); undo(); return;
  }
  if(e.key==="Escape"){ if($("#cfPicker")) closeCF(); else if(!$("#edgeMenu").hidden) closeMenu(); else if(sel.f||sel.n) clearSel(); }
});
// ---------- the divider between the two panels ----------
// How much room the proof gets versus the labeler is a reading preference, so it is draggable and
// remembered. Stored as a PERCENTAGE of the window, so it still means the same thing in a window of
// a different size. Every width change has to redraw the edges: the wires are positioned from
// getBoundingClientRect, so moving the right panel moves every endpoint under them.
const SPLIT_KEY="pistis.proofWidth", SPLIT_DEFAULT=46;
function setProofWidth(pct){
  if(!isFinite(pct)) return;
  pct=Math.min(85,Math.max(15,pct));                 // always leave both panels usable
  $("#proof").style.flexBasis=pct.toFixed(2)+"%";
  try{ localStorage.setItem(SPLIT_KEY,String(pct)); }catch(e){}
  if(B&&B.has_targets) drawEdges();
}
(function initSplit(){
  let saved=null; try{ saved=localStorage.getItem(SPLIT_KEY); }catch(e){}
  if(saved!==null) setProofWidth(parseFloat(saved));
  const bar=$("#split");
  // pointer capture, so the drag survives the cursor crossing into either panel (or leaving the
  // window) without needing listeners on document
  bar.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    e.preventDefault();
    bar.setPointerCapture(e.pointerId);
    bar.classList.add("dragging"); document.body.classList.add("resizing");
  });
  bar.addEventListener("pointermove",e=>{
    if(!bar.classList.contains("dragging")) return;
    setProofWidth(e.clientX/window.innerWidth*100);
  });
  const end=e=>{
    if(!bar.classList.contains("dragging")) return;
    try{ bar.releasePointerCapture(e.pointerId); }catch(err){}
    bar.classList.remove("dragging"); document.body.classList.remove("resizing");
  };
  bar.addEventListener("pointerup",end);
  bar.addEventListener("pointercancel",end);
  bar.addEventListener("dblclick",()=>setProofWidth(SPLIT_DEFAULT));
})();

let raf=null;
window.addEventListener("scroll",()=>{ if(raf)return; raf=requestAnimationFrame(()=>{raf=null; if(B&&B.has_targets)drawEdges();}); },true);
window.addEventListener("resize",()=>{ if(B&&B.has_targets)drawEdges(); });
window.addEventListener("beforeunload",e=>{ if(dirty){e.preventDefault();e.returnValue="";} });
window.addEventListener("load",()=>{ if(B&&B.has_targets) render(); });   // re-render once KaTeX (deferred) is ready
// re-render once Shiki (async) is ready — both panels highlight Lean with it
window.shikiReady=()=>{ ProofPane.rerender(); if(B&&B.has_targets) render(); };
// the proof first: it is the index, and it decides which unit opens when no ?path= is given
ProofPane.mount($("#proof"),openUnit).then(loadList);
</script>
